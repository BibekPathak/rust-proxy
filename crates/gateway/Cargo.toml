[package]
name = "rustproxy-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Asynchronous SOCKS5 gateway for RustProxy."
publish = false

[dependencies]
rustproxy-common = { path = "../common" }
rustproxy-protocol = { path = "../protocol" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
axum = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
rustproxy-control-plane = { path = "../control-plane" }
rustproxy-common = { path = "../common" }
sqlx = { workspace = true }
