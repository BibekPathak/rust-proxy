# Proxy node agent configuration (Docker demo).
node_id = "node-1"
control_plane_url = "http://control-plane:8080"
# api_token = "changeme"
bind_addr = "0.0.0.0:20001"
advertised_address = "node-1:20001"
bandwidth_limit = 10485760   # 10 MiB/s
max_connections = 128
heartbeat_interval = "5s"
upstream_timeout = "10s"

[logging]
level = "info"
json = true
